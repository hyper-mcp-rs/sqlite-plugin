name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/nightly.yml"
      - ".github/workflows/release.yml"
      - "**/*.md"
      - ".cursor/**"
      - ".windsurf/**"
      - ".gitignore"
      - "LICENSE"
      - ".github/renovate.json5"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Install WASM target
        run: rustup target add wasm32-wasip1

      - name: Install WASI SDK
        run: |
          WASI_VERSION=25
          WASI_VERSION_FULL=25.0
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            WASI_ARCH=x86_64
          elif [ "$ARCH" = "aarch64" ]; then
            WASI_ARCH=arm64
          else
            echo "Unsupported architecture: $ARCH" && exit 1
          fi
          cd /opt
          sudo wget https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/wasi-sdk-${WASI_VERSION_FULL}-${WASI_ARCH}-linux.tar.gz
          sudo tar xvf wasi-sdk-${WASI_VERSION_FULL}-${WASI_ARCH}-linux.tar.gz
          sudo rm wasi-sdk-${WASI_VERSION_FULL}-${WASI_ARCH}-linux.tar.gz
          sudo mv wasi-sdk-${WASI_VERSION_FULL}-${WASI_ARCH}-linux wasi-sdk
          echo "WASI_SDK_PATH=/opt/wasi-sdk" >> $GITHUB_ENV
          echo "CC_wasm32_wasip1=/opt/wasi-sdk/bin/clang --sysroot=/opt/wasi-sdk/share/wasi-sysroot" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Build plugin
        run: cargo build --release --target wasm32-wasip1
